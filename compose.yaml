# Entorno de desarrollo completo: base de datos + API.
#
#   docker compose up --build     -> levanta MySQL y la API en http://localhost:8080
#   docker compose up db          -> levanta solo MySQL, para correr la API desde el IDE
#                                    con ./mvnw spring-boot:run (hot reload)
#
# Los valores de este archivo son de DESARROLLO. Produccion (Railway) toma los
# suyos de variables de entorno y no comparte ninguna credencial con esto.

services:
  db:
    image: mysql:9
    container_name: oriente-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: oriente
      MYSQL_DATABASE: oriente
      MYSQL_USER: oriente
      MYSQL_PASSWORD: oriente
      TZ: UTC
    # UTC en el servidor de la base: la aplicacion tambien guarda en UTC, y si
    # los dos lados no coinciden las fechas se corren al pasar por el driver.
    command:
      - --default-time-zone=+00:00
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "3306:3306"
    volumes:
      - datos-de-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-poriente"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  api:
    build:
      context: .
    container_name: oriente-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # allowPublicKeyRetrieval hace falta porque MySQL 9 autentica con
      # caching_sha2_password y en desarrollo la conexion va sin TLS.
      DB_URL: jdbc:mysql://db:3306/oriente?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: oriente
      DB_PASSWORD: oriente
      ADMIN_USERNAME: orienteadmin
      ADMIN_PASSWORD: desarrollo
      JWT_SECRET: c2VjcmV0by1kZS1kZXNhcnJvbGxvLXNvbG8tcGFyYS1kb2NrZXItY29tcG9zZS0yMDI2
      CORS_ORIGENES_PUBLICOS: http://localhost:4321,http://localhost:5173
      CORS_ORIGENES_DE_ADMINISTRACION: http://localhost:5174,http://localhost:5173
      # Las credenciales de Cloudinary salen de un .env local (ignorado por git),
      # no de este archivo: son las mismas de la cuenta real. Sin ellas la API
      # arranca igual y solo falla el endpoint que firma las subidas.
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      CLOUDINARY_FOLDER: ${CLOUDINARY_FOLDER:-oriente}
      TZ: UTC
    ports:
      - "8080:8080"

volumes:
  datos-de-mysql:
