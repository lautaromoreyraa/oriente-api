spring:
  application:
    name: oriente-api

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/oriente?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:oriente}
    # Sin default: una password de base con valor por defecto es una password conocida.
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 5000
      maximum-pool-size: 5

  jpa:
    hibernate:
      # Flyway es el unico dueno del esquema. Un update automatico al renombrar
      # un campo deja la columna vieja poblada y la nueva vacia, sin avisar.
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        # UTC en los dos lados: el contenedor de la base arranca con
        # --default-time-zone=+00:00 y aca se guarda en UTC.
        jdbc:
          time_zone: UTC
          batch_size: 20
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    # El esquema de produccion ya existe, creado por el ddl-auto: update anterior.
    # V1 describe ese estado: en una base que ya lo tiene, Flyway lo marca como
    # aplicado en lugar de intentar crear tablas existentes.
    baseline-on-migrate: true
    baseline-version: 1

  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}

logging:
  level:
    root: INFO
    org.springframework.security: INFO
    org.hibernate: WARN

oriente:
  seguridad:
    administrador:
      usuario: ${ADMIN_USERNAME:orienteadmin}
      # Sin default, a proposito.
      password: ${ADMIN_PASSWORD}
    jwt:
      # Sin default, a proposito.
      secret: ${JWT_SECRET}
      expiracion-en-milisegundos: ${JWT_EXPIRATION:86400000}
    cors:
      # Dos listas separadas: la web publica y el panel no comparten origen.
      origenes-publicos: ${CORS_ORIGENES_PUBLICOS:http://localhost:4321,http://localhost:5173,http://localhost:4173}
      origenes-de-administracion: ${CORS_ORIGENES_DE_ADMINISTRACION:http://localhost:5174,http://localhost:5173}
  cloudinary:
    nombre-de-la-nube: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    # Vacio significa "sin configurar": la aplicacion arranca y el endpoint de
    # firma responde 503 con un mensaje claro, en lugar de firmar con una clave
    # de ejemplo que nadie revisaria.
    api-secret: ${CLOUDINARY_API_SECRET:}
    carpeta: ${CLOUDINARY_FOLDER:oriente}
  instagram:
    url-de-la-api: ${INSTAGRAM_API_URL:https://graph.instagram.com}
    # Token de larga duracion de la cuenta profesional. Vacio significa "sin
    # conectar": importar publicaciones responde 503 y el resto de la API anda.
    token-de-acceso: ${INSTAGRAM_ACCESS_TOKEN:}
